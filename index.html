<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>حساب المعدل الدراسي - التعليم المتوسط</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/minireset.css/0.0.6/minireset.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/normalize/8.0.1/normalize.min.css">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="app-container">
        <header class="main-header">
            <div class="header-content">
                <h1>حساب المعدل الدراسي</h1>
                <p>التعليم المتوسط - الجزائري</p>
            </div>
        </header>
        
        <main class="main-content">
            <section class="card semester-control animate-in">
                <div class="card-inner">
                    <h2>
                        <svg class="icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 2v4M16 2v4M3 10h18M5 4h14a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2z"/></svg>
                        اختر الفصل الدراسي
                    </h2>
                    <select id="semester-select" class="glass-input">
                        <option value="" disabled selected>اختر الفصل</option>
                        <option value="1">الفصل الأول</option>
                        <option value="2">الفصل الثاني</option>
                        <option value="3">الفصل الثالث</option>
                    </select>
                </div>
            </section>
    
            <!-- Form is visible by default -->
            <section id="subject-input-form" class="card subject-input-form animate-in disabled-form">
                <div class="card-inner">
                    <h2>
                        <svg class="icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
                        <span id="form-title">إضافة مادة</span>
                    </h2>
                    <div class="form-grid">
                        <div class="form-row">
                            <div class="form-group">
                                <label for="subject-name">المادة</label>
                                <select id="subject-name" class="glass-input">
                                    <option value="" disabled selected>اختر المادة</option>
                                    <option value="رياضيات">رياضيات</option>
                                    <option value="لغة عربية">لغة عربية</option>
                                    <option value="لغة فرنسية">لغة فرنسية</option>
                                    <option value="لغة إنجليزية">لغة إنجليزية</option>
                                    <option value="علوم فيزيائية">علوم فيزيائية</option>
                                    <option value="علوم الطبيعة والحياة">علوم الطبيعة والحياة</option>
                                    <option value="تاريخ وجغرافيا">تاريخ وجغرافيا</option>
                                    <option value="تربية إسلامية">تربية إسلامية</option>
                                    <option value="تربية مدنية">تربية مدنية</option>
                                    <option value="إعلام آلي">إعلام آلي</option>
                                    <option value="تربية تشكيلية">تربية تشكيلية</option>
                                    <option value="تربية موسيقية">تربية موسيقية</option>
                                    <option value="تربية بدنية">تربية بدنية</option>
                                    <option value="لغة أمازيغية">لغة أمازيغية</option>
                                </select>
                            </div>
                            <div class="form-group">
                                <label for="subject-coefficient">المعامل</label>
                                <input type="number" id="subject-coefficient" class="glass-input numeric-input" placeholder="مثال: 3" min="1" max="5">
                            </div>
                        </div>
                        <div class="form-row">
                            <div class="form-group">
                                <label for="assignment-grade">درجة الفرض</label>
                                <input type="number" id="assignment-grade" class="glass-input numeric-input" placeholder="من 0 إلى 20" min="0" max="20" step="0.25">
                            </div>
                            <div class="form-group">
                                <label for="exam-grade">درجة التقويم المستمر</label>
                                <input type="number" id="exam-grade" class="glass-input numeric-input" placeholder="من 0 إلى 20" min="0" max="20" step="0.25">
                            </div>
                        </div>
                        <div class="form-row">
                            <div class="form-group">
                                <label for="final-grade">درجة الاختبار</label>
                                <input type="number" id="final-grade" class="glass-input numeric-input" placeholder="من 0 إلى 20" min="0" max="20" step="0.25">
                            </div>
                        </div>
                    </div>
                    <button id="add-subject-btn" class="primary-button" disabled>
                        <span id="form-button-text">إضافة المادة</span>
                    </button>
                </div>
            </section>
    
            <!-- Hidden by default, shown when at least one subject is added -->
            <section id="subjects-list-section" class="card subjects-list-section animate-in hidden">
                <div class="card-inner">
                    <h2>
                        <svg class="icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><polyline points="10 9 9 9 8 9"/></svg>
                        المواد المضافة
                    </h2>
                    <ul id="subjects-list" class="subjects-list">
                        <!-- سيتم إضافة المواد هنا ديناميكيًا -->
                    </ul>
                </div>
            </section>
    
            <section class="card results-section animate-in">
                <div class="card-inner">
                    <h2>
                        <svg class="icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg>
                        النتائج
                    </h2>
                    <div class="results-grid">
                        <div class="result-item">
                            <span class="result-label">المعدل الفصلي:</span>
                            <span id="semester-average" class="result-value">--</span>
                        </div>
                        <div class="result-item">
                            <span class="result-label">التقييم:</span>
                            <span id="grade-evaluation" class="result-value">--</span>
                        </div>
                        <div class="result-item">
                            <span class="result-label">المعدل السنوي:</span>
                            <span id="annual-average" class="result-value disabled">--</span>
                        </div>
                    </div>
                    <div class="chart-container">
                        <canvas id="performance-chart"></canvas>
                    </div>
                </div>
            </section>
        </main>
               
        <footer class="main-footer">
            <p>&copy; 2025 جميع الحقوق محفوظة.</p>
            <button id="clear-data-btn" class="secondary-button">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
                مسح البيانات
            </button>
        </footer>

        <!-- حاوية الإشعارات -->
        <div id="notification-container"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="script.js"></script>
</body>
</html>
